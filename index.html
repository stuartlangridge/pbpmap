<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./pbpmap-icon-48x48.png" sizes="48x48" >
<script src="remotestorage.js"></script>
<script src="widget.js"></script>
<script src="screen-manager.js"></script>
<script src="map-canvas.js"></script>
<script src="page-grid.js"></script>
<script src="export-area.js"></script>
<script src="token-manager.js"></script>
<script src="battlefield-effects.js"></script>
<script src="export-image.js"></script>
<script src="get-link.js"></script>
<script src="tool-dialogue.js"></script>
<style>
html, body { width: 100vw; height: 100vh; padding: 0; margin: 0; overflow: hidden; }
tool-dialogue {
    position: absolute;
    width: 25vw;
    top: 0vw;
    right: 0vw;
    bottom: 0vw;
}
#remotestorage-widget { z-index: 20; position: absolute; }

@media (max-width: 750px) {
    tool-dialogue {
        position: absolute;
        width: 100vw;
        bottom: 0;
        left: 0;
        top: auto;
        right: auto;
        overflow-y: auto;
        max-height: 50vh;
    }
}

dialog#token-chooser {
    border: 1px solid #888;
    background: #ffffe0;
    border-radius: 5px;
    padding: 3em;
}
dialog#token-chooser form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
dialog#token-chooser::backdrop {
    background-color: rgba(0, 0, 0, 0.6);
}
dialog#token-chooser h1 {
    margin: 0 0 1em;
    font-size: 1.1em;
    text-align: center;
    grid-column: 1/3;
}
dialog#token-chooser label {
    grid-column: 1/3;
    grid-template-columns: subgrid;
    display: grid;
}

dialog#token-chooser div#token-chooser-buttons {
    grid-column: 1/3;
    display: flex;
    justify-content: end;
    gap: 10px;
}
dialog#token-chooser div#token-chooser-buttons button {
    font-size: 1.2em;
}

</style>
</head>
<body>
<map-canvas></map-canvas>
<page-grid></page-grid>
<get-link></get-link>
<export-area></export-area>
<token-manager></token-manager>
<battlefield-effects></battlefield-effects>
<export-image></export-image>
<tool-dialogue></tool-dialogue>
<screen-manager></screen-manager>

</body>
</html>
